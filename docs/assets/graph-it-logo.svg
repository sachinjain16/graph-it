<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Graph-It</title>
  <desc id="desc">Graph-It brand banner showing a local semantic graph, an AI agent cursor, and enterprise-safe coding-agent context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.42" stop-color="#071A33"/>
      <stop offset="1" stop-color="#0F2847"/>
    </linearGradient>
    <radialGradient id="halo" cx="32%" cy="45%" r="58%">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.32"/>
      <stop offset="0.45" stop-color="#2563EB" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.48" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082F49"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="nodeBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="nodePurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE9FE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.22 0 0 0 0 0.76 0 0 0 0 1 0 0 0 0.65 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="36" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="36" fill="url(#halo)"/>
  <path d="M52 286 C178 162 294 320 420 176 C538 41 650 104 742 156 C860 222 956 80 1148 132" fill="none" stroke="#1D4ED8" stroke-width="2" opacity="0.35"/>
  <path d="M60 74 C202 148 289 40 426 112 C542 173 634 68 758 96 C890 126 982 236 1142 194" fill="none" stroke="#0E7490" stroke-width="2" opacity="0.28"/>

  <g transform="translate(72 48)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="314" height="264" rx="30" fill="url(#panel)" stroke="#1E40AF" stroke-width="1.5"/>
    <rect x="24" y="24" width="266" height="216" rx="22" fill="#020617" stroke="#164E63"/>
    <text x="42" y="56" fill="#7DD3FC" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700">.semantic-kg/graph.json</text>

    <g stroke="#38BDF8" stroke-width="3" opacity="0.88">
      <line x1="86" y1="106" x2="156" y2="78"/>
      <line x1="156" y1="78" x2="222" y2="116"/>
      <line x1="86" y1="106" x2="116" y2="166"/>
      <line x1="222" y1="116" x2="188" y2="190"/>
      <line x1="116" y1="166" x2="188" y2="190"/>
      <line x1="156" y1="78" x2="154" y2="136"/>
      <line x1="154" y1="136" x2="116" y2="166"/>
      <line x1="154" y1="136" x2="222" y2="116"/>
      <line x1="154" y1="136" x2="188" y2="190"/>
      <line x1="86" y1="106" x2="154" y2="136"/>
    </g>

    <g filter="url(#softGlow)">
      <circle cx="156" cy="78" r="15" fill="url(#nodeBlue)"/>
      <circle cx="86" cy="106" r="13" fill="url(#nodePurple)"/>
      <circle cx="222" cy="116" r="13" fill="#22D3EE"/>
      <circle cx="154" cy="136" r="18" fill="#F8FAFC"/>
      <circle cx="116" cy="166" r="13" fill="#60A5FA"/>
      <circle cx="188" cy="190" r="13" fill="#34D399"/>
    </g>

    <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle">
      <text x="156" y="82" fill="#082F49">MCP</text>
      <text x="154" y="140" fill="#0F172A">AI</text>
    </g>

    <path d="M205 176 L264 231 L233 238 L251 275 L229 286 L211 247 L187 270 Z" fill="#F8FAFC" stroke="#020617" stroke-width="4"/>
    <path d="M205 176 L264 231 L233 238" fill="none" stroke="#67E8F9" stroke-width="2.5"/>
  </g>

  <g transform="translate(438 76)">
    <text x="0" y="0" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="78" font-weight="850" letter-spacing="-3">Graph-It</text>
    <text x="3" y="50" fill="#BAE6FD" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" font-weight="650">Local semantic graphs for AI coding agents</text>
    <text x="4" y="88" fill="#CBD5E1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17">
      Query compact, evidence-labeled context before opening raw files.
    </text>

    <g transform="translate(4 122)" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="750">
      <rect x="0" y="0" width="132" height="36" rx="18" fill="#082F49" stroke="#38BDF8"/>
      <text x="19" y="23" fill="#E0F2FE">MCP-native</text>

      <rect x="150" y="0" width="130" height="36" rx="18" fill="#172554" stroke="#60A5FA"/>
      <text x="170" y="23" fill="#DBEAFE">Local-first</text>

      <rect x="298" y="0" width="164" height="36" rx="18" fill="#1E1B4B" stroke="#A78BFA"/>
      <text x="318" y="23" fill="#EDE9FE">Evidence labels</text>

      <rect x="480" y="0" width="154" height="36" rx="18" fill="#052E2B" stroke="#34D399"/>
      <text x="500" y="23" fill="#D1FAE5">No uploads</text>
    </g>

    <g transform="translate(4 184)" font-family="Consolas, Menlo, monospace" font-size="14">
      <rect x="0" y="0" width="614" height="52" rx="16" fill="#020617" stroke="#1E40AF" opacity="0.92"/>
      <text x="20" y="32" fill="#7DD3FC">graph-it query --intent=code "TargetSymbol"</text>
      <circle cx="566" cy="26" r="6" fill="#34D399"/>
      <circle cx="588" cy="26" r="6" fill="#60A5FA"/>
    </g>
  </g>
</svg>
