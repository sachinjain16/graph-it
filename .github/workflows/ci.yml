name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    if: github.repository != 'sacjain_microsoft/graph-it'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm run check
      - run: npm test
